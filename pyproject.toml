[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudrules"
version = "0.1.0"
description = "Vendor-neutral rule pack for financial fraud patterns (synthetic identity, bust-out, mules, kiting, structuring, account takeover, payee fraud, elder exploitation) compiled to SQL, Sigma and Python. Engineering checklist, not legal advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]
keywords = ["fraud", "detection-rules", "sigma", "sql", "aml", "bsa", "account-takeover", "fintech"]

[project.optional-dependencies]
sql = ["duckdb>=1.0", "sqlglot>=25"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100", "types-PyYAML", "types-jsonschema", "duckdb>=1.0", "sqlglot>=25"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/fraud-rules"

[project.scripts]
fraudrules = "fraudrules.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraudrules = ["py.typed", "rule.schema.json", "rules/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "sqlglot", "sqlglot.*"]
ignore_missing_imports = true
