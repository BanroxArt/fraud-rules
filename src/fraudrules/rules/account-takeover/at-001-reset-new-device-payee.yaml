id: AT-001
name: reset-new-device-payee
title: Credential reset, then a login from a new device, then a new payee
category: account-takeover
severity: high
status: stable
summary: >-
  Flags a payee added or changed within 24 hours after a password reset or MFA
  change that was followed by a successful login from a device never seen on
  the customer.
rationale: |
  The common account takeover path in digital banking is to reset the
  credential through a weaker channel (a call center, an SMS code on a ported
  number), log in from the attacker's own device, and set up somewhere to send
  the money before anyone notices. Each step happens to real customers; the
  three in order inside a day is the takeover pattern. FFIEC's 2021
  authentication guidance names enhanced controls on credential resets,
  account maintenance and adding payment recipients for this reason, and
  FinCEN's account takeover advisory lists changes to customer and account
  profiles.
sources:
  - publisher: FFIEC
    title: Authentication and Access to Financial Institution Services and Systems (2021)
    url: https://www.federalreserve.gov/frrs/guidance/authentication-and-access-to-financial-institution-services-and-systems-interagency-guidance.htm
    note: Enhanced authentication for credential resets and account maintenance; restrictions on devices for adding payment recipients.
  - publisher: FinCEN
    title: Account Takeover Activity (FIN-2011-A016)
    url: https://www.fincen.gov/resources/advisories/fincen-advisory-fin-2011-a016
false_positives:
  - A customer who forgot a password, got a new phone and paid a new
    contractor on the same day. Rare but real; the payee step is what makes
    it worth a call.
tuning:
  - param: within
    effect: Time from the reset to the payee change.
params:
  within: 24h
sequence:
  key: [customer_id]
  within: $within
  steps:
    - table: events
      where:
        all:
          - {field: event_type, in: [password_reset, mfa_change]}
          - {field: outcome, eq: success}
    - table: events
      where:
        all:
          - {field: event_type, eq: login}
          - {field: outcome, eq: success}
          - {field: device_new, eq: 1}
    - table: events
      where:
        all:
          - {field: event_type, in: [payee_added, payee_changed]}
          - {field: outcome, eq: success}
